<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Solfeo</title>
<meta name="theme-color" content="#F4EAD5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23F4EAD5'/%3E%3Cpath d='M26 46V16l18-4v28' fill='none' stroke='%23C8553D' stroke-width='4'/%3E%3Cellipse cx='21' cy='46' rx='7' ry='5' fill='%23C8553D'/%3E%3Cellipse cx='39' cy='41' rx='7' ry='5' fill='%23C8553D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Music&display=swap">
<style>
:root { --paper: #F4EAD5; --ink: #2D2A32; --acc: #C8553D; --muted: #9C8F80; --card: rgba(250, 244, 230, .93); --hand: "Patrick Hand", "Noto Music", "Comic Sans MS", sans-serif; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--hand); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; transition: background .8s, color .8s; }
#app { position: fixed; inset: 0; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .9s ease; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.bar { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top, 0px)); pointer-events: none; }
.bar > * { pointer-events: auto; }
.score { font-size: clamp(38px, 10vw, 54px); line-height: .9; font-variant-numeric: tabular-nums; }
.sub { font-size: 17px; color: var(--muted); margin-top: 4px; }
.sub b { color: var(--ink); font-weight: 400; }
.tools { display: flex; gap: 8px; align-items: center; }
.lives { font-family: "Noto Music", var(--hand); font-size: 24px; color: var(--acc); letter-spacing: 2px; margin-right: 6px; }
.lives .off { color: var(--muted); opacity: .35; }
.icon { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--ink); background: transparent; color: var(--ink); font: 18px var(--hand); display: grid; place-items: center; cursor: pointer; padding: 0; }
.icon svg { width: 20px; height: 20px; }
.icon.off .wave { display: none; }
.icon:not(.off) .cross { display: none; }
.icon:focus-visible, .btn:focus-visible { outline: 3px solid var(--acc); outline-offset: 3px; }
#prof { position: absolute; left: 6px; bottom: 0; pointer-events: none; }
#prof svg { display: block; width: 100%; height: auto; overflow: visible; }
#prof .body { transform-origin: 50% 100%; animation: breathe 3.6s ease-in-out infinite; }
#prof.hop .body { animation: hop .45s ease-out 2; }
@keyframes breathe { 50% { transform: translateY(-2px) scaleY(1.008); } }
@keyframes hop { 40% { transform: translateY(-9px); } }
#bubble { position: absolute; background: #FFFDF6; color: #2D2A32; border: 2px solid #2D2A32; border-radius: 22px 22px 22px 6px; padding: 10px 14px; font-size: 18px; line-height: 1.22; box-shadow: 3px 4px 0 rgba(45, 42, 50, .18); pointer-events: none; transform-origin: 0 100%; transition: opacity .2s, transform .2s; }
#bubble.gone { opacity: 0; transform: scale(.92); }
#bubble .hint { display: block; margin-top: 6px; font-size: 15px; color: #8A7E70; }
#bubble .hint::before { content: "▶ "; font-size: 11px; vertical-align: 2px; }
.card { position: absolute; left: 16px; right: 16px; margin: 0 auto; max-width: 440px; background: var(--card); color: #2D2A32; border: 2px solid #2D2A32; border-radius: 6px; padding: 18px 20px 20px; box-shadow: 4px 5px 0 rgba(45, 42, 50, .2); display: grid; gap: 12px; }
h1 { margin: 0; font-weight: 400; font-size: clamp(56px, 16vw, 84px); line-height: .85; color: var(--acc); }
h1 small { display: block; font-size: 22px; color: #6E6458; margin-top: 8px; letter-spacing: .02em; }
.tag { margin: 0; font-size: 19px; line-height: 1.25; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 17px; color: #6E6458; }
.stats b { color: #2D2A32; font-weight: 400; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 120px; min-height: 52px; border-radius: 26px; border: 2px solid #2D2A32; background: transparent; color: #2D2A32; font: 21px var(--hand); cursor: pointer; padding: 0 16px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mode { flex: 1 1 0; min-height: 46px; border-radius: 10px; border: 2px solid #2D2A32; background: transparent; color: #2D2A32; font: 18px var(--hand); cursor: pointer; padding: 2px 4px; line-height: 1.05; }
.mode small { display: block; font-size: 13px; color: #6E6458; }
.mode[aria-pressed="true"] { background: #2D2A32; color: #FBF7EC; }
.mode[aria-pressed="true"] small { color: #E8DFCC; }
.btn.primary { background: var(--acc); border-color: #2D2A32; color: #fff; box-shadow: 2px 3px 0 #2D2A32; }
#report { background-image: repeating-linear-gradient(transparent 0 29px, rgba(61, 106, 168, .16) 29px 30px); background-color: #FBF7EC; }
.rhead { font-size: 26px; border-bottom: 3px double #2D2A32; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; }
.rhead span { font-size: 16px; color: #6E6458; }
.rows { display: grid; gap: 2px; margin: 0; font-size: 19px; }
.rows div { display: flex; justify-content: space-between; gap: 12px; }
.rows dd { margin: 0; text-align: right; }
.grade { justify-self: center; font-size: clamp(30px, 8.5vw, 42px); color: var(--acc); border: 3px solid var(--acc); border-radius: 10px; padding: 2px 16px; transform: rotate(-4deg); text-align: center; line-height: 1.1; margin: 6px 0; }
.rnote { font-size: 18px; text-align: center; color: var(--acc); min-height: 1em; }
textarea { width: 100%; box-sizing: border-box; min-height: 74px; font: 15px var(--hand); background: transparent; color: #2D2A32; border: 1px dashed #9C8F80; padding: 8px; }
#story { position: absolute; inset: 0; background: var(--paper); display: flex; align-items: center; justify-content: center; padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); z-index: 5; }
.sframe { width: 100%; max-width: 520px; display: grid; gap: 14px; }
.sart { line-height: 0; }
.sart img { width: 100%; max-height: 72vh; object-fit: contain; display: block; box-shadow: 4px 5px 0 rgba(45, 42, 50, .2); background: #fff; }
#sText { margin: 0; font-size: clamp(20px, 5.2vw, 24px); line-height: 1.35; color: var(--ink); }
#sText .dlg { display: block; margin-top: 4px; }
.sfoot { display: flex; align-items: center; gap: 10px; }
.dots { flex: 1; display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .4; }
.dots i.on { background: var(--acc); opacity: 1; }
.sfoot .btn { flex: 0 0 auto; min-width: 110px; }
.link { background: none; border: 0; padding: 4px 0; font: 17px var(--hand); color: #6E6458; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: center; }
.fadein { animation: fadein .45s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { #prof .body { animation: none !important; } .bg { transition: none; } }
</style>
</head>
<body>
<div id="app">

          <ellipse cx="134" cy="105" rx="8" ry="12.5" fill="#E8BC99"/>
          <path d="M70 90C70 61 130 61 130 90L130 116C128 140 114 156 100 156C86 156 72 140 70 116Z" fill="#EEC7A4"/>

          <path d="M70 108C71 138 86 160 100 161C114 160 129 138 130 108C126 121 117 128 100 128C83 128 74 121 70 108Z" fill="#C9C6BF"/>
          <path d="M84 129C90 121 110 121 116 129C110 126 105 127 100 129C95 127 90 126 84 129Z" fill="#4A4038"/>
          <circle cx="82" cy="115" r="6" fill="#E39A86" opacity=".4"/>
          <circle cx="118" cy="115" r="6" fill="#E39A86" opacity=".4"/>
        </g>
        <g fill="none" stroke="#3A2E2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 232C26 196 50 180 84 174M116 174C150 180 174 196 178 232"/>
          <path d="M82 176Q100 190 118 176"/>

          <path d="M104 196q6 -6 12 0M104 196q0 7 6 7q6 0 6 -7M118 198q6 -6 12 0M118 198q0 7 6 7q6 0 6 -7M116 197q1 -2 2 0" stroke="#15151A" stroke-width="2"/>

      </g>

  </div>
  <div id="bubble" class="gone" aria-live="polite"><span id="bText"></span><span class="hint" id="bHint" hidden></span></div>

  <div class="card" id="menu">
    <h1>Solfeo<small>Do · Re · Mi · Fa · Sol · La · Si</small></h1>
    <p class="tag" data-i18n="tagline"></p>
    <div class="modes" id="modes">
      <button class="mode" data-mode="prep"><span data-i18n="m_prep"></span><small>𝅗𝅥 ♩</small></button>
      <button class="mode" data-mode="mid"><span data-i18n="m_mid"></span><small>♩ ♪</small></button>
      <button class="mode" data-mode="sup"><span data-i18n="m_sup"></span><small>♩ ♪ 𝄪</small></button>
      <button class="mode" data-mode="exp"><span data-i18n="m_exp"></span><small data-i18n="m_expSub"></small></button>

    <div class="rhead"><span data-i18n="report" style="font-size:26px;color:inherit"></span><span id="rDate"></span></div>
    <dl class="rows">
      <div><dt data-i18n="level"></dt><dd id="rMode"></dd></div>
      <div><dt data-i18n="points"></dt><dd id="rPts"></dd></div>
      <div><dt id="rPassedLabel"></dt><dd id="rPassed"></dd></div>
      <div><dt id="rScaleLabel"></dt><dd id="rScale"></dd></div>
    </dl>
    <div class="grade" id="rGrade"></div>
    <div class="rnote" id="rNote"></div>

  <div id="story" hidden>
    <div class="sframe">
      <div class="sart" id="sArt"></div>
      <p id="sText"></p>
      <div class="sfoot">
        <div class="dots" id="sDots"></div>

        <button class="btn primary" id="sNext"></button>
      </div>
    </div>

</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const TAU = Math.PI * 2;
const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const LANGS = ['es', 'ca', 'en'];
const navL = (navigator.language || 'es').toLowerCase();
let lang = store.get('lang', null) || (navL.startsWith('ca') ? 'ca' : navL.startsWith('es') ? 'es' : 'en');
if (!LANGS.includes(lang)) lang = 'es';

const STR = {

  particles = []; floaters = [];
  $('menu').hidden = true; $('report').hidden = true; $('shareText').hidden = true;
  intro(0);
}
function play() {
  clearPreview(); if (ex.k !== 'song') hideBubble(); face('neutral');
  state = 'play'; stateT = clock;
  spawn();
}
function burst(rr, n, size) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + Math.random() * 0.3;
    particles.push({ a, r: rr, v: 0.18 + Math.random() * 0.5, life: 1, size: size * (0.6 + Math.random() * 0.8) });
  }
}
function hit(perfect) {
  const it = seq[pos];
  it.res = perfect ? 2 : 1;
  let pts = 1;
  if (perfect) { combo++; pts = 2 + Math.min(combo - 1, 3); } else combo = 0;
  score += pts;
  pulse = 1; shake = perfect ? 4 : 2;
  burst(rt, perfect ? 20 : 11, perfect ? 6 : 4);
  floaters.push({ text: '+' + pts + (perfect ? ' ' + t('perfect') : ''), life: 1, hot: perfect });
  pluck(it.m, perfect ? 0.26 : 0.2, VAL[it.v].dur * (perfect ? 1.15 : 1));
  buzz(perfect ? 14 : 6);
  if (perfect && combo > 0 && combo % 5 === 0) { say(t('praise'), 'happy', '', 1300); hop(); }
  advance();
}
function restOk() {
  const it = seq[pos]; it.res = 1; score += 1;
  floaters.push({ text: '𝄽 ✓', life: 1, hot: false });
  tick();
  advance();
}
function advance() {
  pos++;
  paintTop();
  if (pos >= seq.length) finishExercise(); else spawn();
}
function finishExercise() {
  completed++;
  if (ex.k === 'song') {
    score += 5; paintTop(); hop();
    state = 'cheer'; stateT = clock;
    ring = { r: -1, dir: -1, v: 0, rest: false };
    return;
  }
  let msg = t('done');
  if (exMistakes === 0) { score += 5; msg += ' ' + (lives < 3 ? t('clean') : t('cleanFull')); if (lives < 3) lives++; }
  paintTop();
  const root = ex.k === 'chrom' ? 60 : scaleNotes(ex)[0].m;
  cadence(root, ex.k !== 'major' && ex.k !== 'chrom');
  say(msg, 'happy', '', 0); hop();
  state = 'cheer'; stateT = clock;
  ring = { r: -1, dir: -1, v: 0, rest: false };
}
function mistake(kind) {
  lives--; exMistakes++; combo = 0;
  flash = 1; shake = 8;
  const it = seq[pos];
  sour(it.rest ? 64 : it.m);
  buzz([30, 40, 60]);
  paintTop();
  const text = mode === 'exp' ? t(kind) + t('expFail') : t(kind) + ' ' + (lives > 0 ? t('faults', { n: 3 - lives }) : t('lastFault'));
  state = 'oops'; stateT = clock; failKind = kind;
  say(text, 'stern', lives > 0 ? t('tapOn') : '');
  if (lives <= 0) { state = 'ending'; setTimeout(showReport, 2300); }
}
let failKind = '';
function gradeOf(n) { const L = LIST().length, c = f => Math.ceil(L * f); return n >= c(0.6) ? 3 : n >= c(0.3) ? 2 : n >= c(0.13) ? 1 : 0; }
let lastReport = null;
function showReport() {
  state = 'over';
  const gi = gradeOf(completed);
  const prevBest = best;
  if (score > best) { best = score; store.set('solfeo:best:' + mode, best); }
  if (gi > bestGrade) { bestGrade = gi; store.set('solfeo:grade:' + mode, gi); }
  lastReport = { gi, score, completed, scale: ex, mode, newBest: score > prevBest && score > 0 };
  renderReport();
  $('report').hidden = false; $('shareText').hidden = true;
  say(STR[lang].gradeTalk[gi], gi >= 2 ? 'happy' : gi === 1 ? 'neutral' : 'stern');
  if (gi >= 2) hop();
  $('again').focus({ preventScroll: true });
}
function renderReport() {
  const r = lastReport; if (!r) return;
  $('rMode').textContent = t('m_' + r.mode);
  $('rPts').textContent = r.score;
  $('rPassed').textContent = r.completed;
  $('rScaleLabel').textContent = t(r.mode === 'exp' ? 'lastSong' : 'lastScale');
  $('rPassedLabel').textContent = t(r.mode === 'exp' ? 'songsPassed' : 'passed');
  $('rScale').textContent = scaleName(r.scale);
  $('rGrade').textContent = STR[lang].grades[r.gi];
  $('rNote').textContent = r.newBest ? t('newBest') : '';
  const d = new Date();
  $('rDate').textContent = d.toLocaleDateString(lang === 'ca' ? 'ca-ES' : lang === 'en' ? 'en-GB' : 'es-ES');
}
function shareText() {
  const r = lastReport;
  return t('shareTxt', { m: t('m_' + r.mode), g: STR[lang].grades[r.gi], p: r.score, n: r.completed }) + '\n' + location.origin + location.pathname;
}
function share() {
  const text = shareText(), btn = $('shareBtn');
  let framed = true; try { framed = window.self !== window.top; } catch (e) {}
  if (!framed && navigator.share) { navigator.share({ text }).catch(() => {}); return; }
  const fail = () => { const ta = $('shareText'); ta.value = text; ta.hidden = false; ta.select(); };
  try { navigator.clipboard.writeText(text).then(() => { const o = btn.textContent; btn.textContent = t('copied'); setTimeout(() => { btn.textContent = o; }, 1600); }, fail); } catch (e) { fail(); }
}
function showMenu() {
  state = 'menu'; clearPreview();
  loadBest(); paintModes();
  exIdx = 0; ex = LIST()[0]; seq = buildSeq(ex, false); pos = 0; setSpeed(0);
  setPalette(0);
  ring = { r: 1.25, dir: -1, v: 0.42, rest: false }; rtTo = 0.42;
  $('mBest').textContent = best;
  $('mGradeWrap').hidden = bestGrade < 0;
  if (bestGrade >= 0) $('mGrade').textContent = STR[lang].grades[bestGrade];
  $('report').hidden = true; $('menu').hidden = false;
  paintTop();
  say(t(mode === 'exp' ? 'helloExp' : 'hello'), 'happy');
}

function paintModes() { document.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode))); }
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; store.set('solfeo:mode', mode); showMenu(); }));
function tap() {
  if (state === 'intro') { if (clock - stateT > 0.45) play(); return; }
  if (state === 'lead') { if (clock - stateT > 0.4) play(); return; }
  if (state === 'oops') { if (clock - stateT > 0.6) play(); return; }
  if (state !== 'play') return;
  if (ring.rest) { mistake('rest'); return; }
  const d = Math.abs(ring.r - rt);
  const tl = ring.tol || tol;
  if (d > tl) { const early = ring.dir < 0 ? ring.r > rt : ring.r < rt; mistake(early ? 'early' : 'late'); return; }
  hit(d <= tl * 0.38);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
function update(dt) {
  clock += dt;
  if (rtT < 1) { rtT = Math.min(1, rtT + dt / 0.2); rt = lerp(rtFrom, rtTo, easeOutBack(rtT)); }
  if (state === 'play') {
    ring.r += ring.dir * ring.v * dt;
    const tl = ring.tol || tol, past = ring.dir < 0 ? ring.r < rt - tl : ring.r > rt + tl;
    if (past) { if (ring.rest) restOk(); else mistake('late'); }
  } else if (state === 'menu') {
    ring.r -= ring.v * dt;
    if (ring.r < rt) { pulse = 1; ring.r = 1.25; pos = (pos + 1) % seq.length; }
  } else if (state === 'cheer') {
    if (clock - stateT > (ex.k === 'song' ? 0.7 : 1.9)) intro(exIdx + 1);
  } else if (state === 'lead') {
    if (clock - stateT > (exIdx === 0 ? 2.6 : 0.9)) play();
  }
  staffScroll += (staffTarget() - staffScroll) * Math.min(1, dt * 5);
  pulse = Math.max(0, pulse - dt * 3.2);
  shake = Math.max(0, shake - dt * 28);
  flash = Math.max(0, flash - dt * 1.5);
  particles.forEach(p => { p.r += p.v * dt; p.v *= 0.93; p.life -= dt * 1.4; });
  particles = particles.filter(p => p.life > 0);
  floaters.forEach(f => { f.life -= dt * 1.3; });
  floaters = floaters.filter(f => f.life > 0);
}

function wobble(r, width, color, seed, amp) {
  g.beginPath();
  for (let i = 0; i <= 72; i++) {
    const a = (i / 72) * TAU, rr = Math.max(0.5, r * S + Math.sin(a * 3 + seed) * amp + Math.sin(a * 7 + seed * 2.3) * amp * 0.5);
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.lineWidth = width; g.strokeStyle = color; g.stroke();
}
function alpha(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}
function draw() {
  g.clearRect(0, 0, W, H);
  g.save();
  g.translate(cx + (Math.random() - 0.5) * shake, cy + (Math.random() - 0.5) * shake);
  const err = state === 'oops' || state === 'ending';
  const RED = P.dark ? '#FF8A70' : '#B8322A';

  g.setLineDash([2, 9]); g.lineCap = 'round';
  g.beginPath(); g.arc(0, 0, 1.25 * S, 0, TAU); g.lineWidth = 2; g.strokeStyle = alpha(P.ink, 0.25); g.stroke();
  g.setLineDash([]);

  const tl = state === 'menu' ? 0.08 : (ring.tol || tol);
  if (rt > 0) {
    g.beginPath(); g.arc(0, 0, (rt + tl) * S, 0, TAU); g.arc(0, 0, Math.max(0, rt - tl) * S, 0, TAU, true);
    g.fillStyle = alpha(err ? RED : P.acc, err ? 0.12 + flash * 0.2 : 0.17); g.fill();
    wobble(rt * (1 + pulse * 0.06), 4.5 + pulse * 6, err ? RED : P.ink, 1.3, 1.1);
    wobble(rt * (1 + pulse * 0.06) + 0.012, 1.2, alpha(err ? RED : P.ink, 0.35), 4.1, 1.6);
  }

  const showRing = (state === 'play' || state === 'menu' || err) && ring.r > 0;
  if (showRing) {
    if (ring.rest) {
      g.setLineDash([3, 8]);
      wobble(ring.r, 3, alpha(P.muted, 0.95), 2.2, 0.8);
      g.setLineDash([]);
    } else if (ring.dir < 0) {
      wobble(ring.r, 3.2, err ? RED : P.acc, 2.7, 0.9);
    } else {
      g.beginPath(); g.arc(0, 0, Math.max(0.5, ring.r * S), 0, TAU); g.fillStyle = alpha(P.acc, 0.16); g.fill();
      g.setLineDash([7, 6]); wobble(ring.r, 3.2, err ? RED : P.acc, 2.7, 0.6); g.setLineDash([]);
    }
  }

  const it = seq[pos];
  if (it && (state === 'play' || state === 'menu' || err)) {
    const fs = Math.max(20, Math.min(46, rt * S * 0.62));
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (it.rest) {
      g.font = (fs * 1.25) + 'px "Noto Music", ' + FONT; g.fillStyle = P.muted; g.fillText(VAL[it.v || 'q'].rest, 0, 0);
    } else {
      g.font = fs + 'px ' + FONT; g.fillStyle = err ? RED : P.ink; g.fillText(noteLabel(it), 0, 2 - fs * 0.22);
      g.font = (fs * 0.62) + 'px "Noto Music", ' + FONT; g.fillStyle = alpha(err ? RED : P.ink, 0.6); g.fillText(VAL[it.v || 'q'].fig, 0, fs * 0.58);
    }
  } else if (state === 'intro' || state === 'cheer' || state === 'lead') {
    const fs = Math.max(20, Math.min(40, rt * S * 0.5));
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = (fs * 1.4) + 'px ' + FONT; g.fillStyle = P.acc;
    g.fillText(state === 'cheer' || ex.k === 'song' ? '♫' : ex.d === 'up' ? '↑' : ex.d === 'down' ? '↓' : '↕', 0, 2);
  }

  particles.forEach(p => {
    g.globalAlpha = Math.max(0, p.life) * 0.55;
    g.beginPath(); g.arc(Math.cos(p.a) * p.r * S, Math.sin(p.a) * p.r * S, p.size * (1.6 - p.life * 0.6), 0, TAU);
    g.fillStyle = P.acc; g.fill();
  });
  g.globalAlpha = 1;
  floaters.forEach(f => {
    g.globalAlpha = Math.min(1, f.life * 1.5);
    g.font = (f.big ? 56 : 20) + 'px "Noto Music", ' + FONT;
    g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = f.hot ? P.acc : P.ink;
    g.fillText(f.text, 0, f.big ? -rt * S - 20 - (1.4 - f.life) * 30 : -rt * S - 22 - (1 - f.life) * 30);
  });
  g.globalAlpha = 1;
  g.restore();
  drawStaff();
}

function drawStaff() {
  if (!seq.length) return;
  const n = Math.min(seq.length, WIN), sc = staffScroll;
  const gap = Math.max(5, Math.min(gapMax, (staffR - staffL) / (n * 2.5 + 5)));
  const yOf = s => staffB - s * gap / 2;
  g.save();
  g.lineCap = 'round';
  g.strokeStyle = alpha(P.ink, 0.6); g.lineWidth = 1.1;
  for (let i = 0; i < 5; i++) { const y = staffB - i * gap; g.beginPath(); g.moveTo(staffL, y); g.lineTo(staffR, y); g.stroke(); }
  g.beginPath(); g.moveTo(staffR, staffB); g.lineTo(staffR, staffB - 4 * gap); g.lineWidth = 1.4; g.stroke();
  g.fillStyle = alpha(P.ink, 0.8); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.font = (gap * 4) + 'px "Noto Music"';
  g.fillText('𝄞', staffL + gap * 0.2, yOf(2));
  const x0 = staffL + gap * 4, sp = (staffR - gap * 1.2 - x0) / n;
  const active = state === 'play' || state === 'oops' || state === 'ending';
  g.save(); g.beginPath(); g.rect(x0 - gap * 2.2, staffB - gap * 9, staffR - x0 + gap * 2.2, gap * 15); g.clip();
  const i0 = Math.max(0, Math.floor(sc) - 1), i1 = Math.min(seq.length, Math.ceil(sc) + n + 1);
  for (let i = i0; i < i1; i++) {
    const it = seq[i], rel = i - sc, x = x0 + sp * (rel + 0.5);
    g.globalAlpha = Math.max(0, Math.min(1, rel + 0.8, n - rel + 0.2));
    if (g.globalAlpha <= 0) continue;
    const cur = (active && i === pos) || i === previewIdx;
    const done = it.res && state !== 'intro' && state !== 'menu';
    const col = cur ? P.acc : done ? P.acc : alpha(P.ink, state === 'menu' ? 0.55 : 0.5);
    if (cur) { g.beginPath(); g.arc(x, it.rest ? yOf(4) : yOf(it.step), gap * 1.25, 0, TAU); g.fillStyle = alpha(P.acc, 0.2); g.fill(); }
    if (it.rest) {
      g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = (gap * 3) + 'px "Noto Music"'; g.fillText(VAL[it.v || 'q'].rest, x, yOf(it.v === 'h' ? 4.5 : 4));
      continue;
    }
    const y = yOf(it.step);
    g.strokeStyle = alpha(P.ink, 0.6); g.lineWidth = 1.1;
    for (let s = -2; s >= it.step; s -= 2) { g.beginPath(); g.moveTo(x - gap * 1.05, yOf(s)); g.lineTo(x + gap * 1.05, yOf(s)); g.stroke(); }
    for (let s = 10; s <= it.step; s += 2) { g.beginPath(); g.moveTo(x - gap * 1.05, yOf(s)); g.lineTo(x + gap * 1.05, yOf(s)); g.stroke(); }
    g.save(); g.translate(x, y); g.rotate(-0.35);
    g.beginPath(); g.ellipse(0, 0, gap * 0.66, gap * 0.46, 0, 0, TAU);
    if (it.v === 'h') { g.lineWidth = Math.max(1.4, gap * 0.22); g.strokeStyle = col; g.stroke(); }
    else { g.fillStyle = col; g.fill(); }
    g.restore();
    const up = it.step < 4, sx = up ? x + gap * 0.6 : x - gap * 0.6, ey = up ? y - gap * 3.3 : y + gap * 3.3;
    g.beginPath(); g.moveTo(sx, y + (up ? -gap * 0.15 : gap * 0.15)); g.lineTo(sx, ey);
    g.lineWidth = Math.max(1, gap * 0.13); g.strokeStyle = col; g.stroke();
    if (it.v === 'e') {
      const dy = up ? 1 : -1;
      g.beginPath(); g.moveTo(sx, ey); g.bezierCurveTo(sx + gap * 0.2, ey + dy * gap * 0.9, sx + gap * 1.2, ey + dy * gap * 1.2, sx + gap * 0.8, ey + dy * gap * 2.3);
      g.lineWidth = Math.max(1.2, gap * 0.18); g.stroke();
    }
    if (it.a) {
      g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = (gap * 1.9) + 'px "Noto Music", ' + FONT;
      g.fillText(ASYM[it.a], x - gap * 1.35, y + (it.a < 0 ? -gap * 0.3 : 0));
    }
  }
  g.restore();
  g.restore();
}

$('app').addEventListener('pointerdown', e => {
  if (e.target.closest('button, .card, textarea')) return;
  e.preventDefault(); tap();
});
window.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (e.target.tagName === 'BUTTON') return;
  e.preventDefault();
  if (state === 'menu') begin(); else if (state === 'over') begin(); else tap();
});
$('startBtn').addEventListener('click', begin);
$('again').addEventListener('click', begin);
$('toMenu').addEventListener('click', showMenu);
$('shareBtn').addEventListener('click', share);
function paintMute() { $('mute').classList.toggle('off', muted); $('mute').setAttribute('aria-pressed', String(!muted)); }
$('mute').addEventListener('click', () => { muted = !muted; store.set('solfeo:muted', muted); ensureAudio(); paintMute(); });
$('lang').addEventListener('click', () => {
  lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]; store.set('lang', lang); applyI18n();
  if (state === 'menu') showMenu();
  else if (state === 'story') renderStory();
  else if (state === 'over') { renderReport(); say(STR[lang].gradeTalk[lastReport.gi], curFace); }
  else if (state === 'intro') { paintTop(); say(buildIntro(exIdx, ex), curFace, t('tapGo')); }
  else paintTop();
});
window.addEventListener('resize', resize);

let storyPage = 0;
function openStory() {
  storyPage = 0; state = 'story';
  hideBubble(); $('menu').hidden = true; $('report').hidden = true;
  $('story').hidden = false; renderStory();
}
function renderStory() {
  const pages = STR[lang].story.concat(['']), photo = storyPage === pages.length - 1;
  $('sArt').innerHTML = photo ? '<img src="boletin.jpg" alt="">' : '';
  $('sArt').hidden = !photo; $('sText').hidden = photo;
  const box = photo ? $('sArt') : $('sText'); box.classList.remove('fadein'); void box.offsetWidth; box.classList.add('fadein');
  const tx = $('sText'); tx.innerHTML = '';
  const pg = pages[storyPage];
  if (Array.isArray(pg)) pg.forEach(line => { const sp = document.createElement('span'); sp.className = 'dlg'; sp.textContent = line; tx.append(sp); });
  else tx.textContent = pg;
  $('sDots').innerHTML = pages.map((_, i) => '<i class="' + (i === storyPage ? 'on' : '') + '"></i>').join('');
  $('sNext').textContent = storyPage === pages.length - 1 ? t('toClass') : t('next');
  $('sSkip').hidden = storyPage === pages.length - 1;
}
function closeStory(full) {
  store.set('solfeo:story', true);
  $('story').hidden = true;
  showMenu();
  say(t('moral'), 'neutral');
}
$('sNext').addEventListener('click', () => { if (storyPage < STR[lang].story.length) { storyPage++; renderStory(); } else closeStory(true); });
$('sSkip').addEventListener('click', () => closeStory(false));
$('storyBtn').addEventListener('click', openStory);

applyI18n(); paintMute(); resize(); showMenu();
if (!store.get('solfeo:story', false)) openStory();
if (document.fonts && document.fonts.load) { document.fonts.load('20px "Noto Music"', '𝄞𝄽♯♭'); document.fonts.load('20px "Patrick Hand"'); }
requestAnimationFrame(frame);
</script>
